<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déploiement - GitLab Deployment Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <h1>Demande de Déploiement</h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div th:if="${codeFreeze.globalFreezeEnabled}" class="alert alert-warning">
            <strong>Code Freeze Global Activé</strong>
            <p th:text="${codeFreeze.reason}">Raison du freeze</p>
            <p>Fin prévue: <span th:text="${#temporals.format(codeFreeze.freezeEndDate, 'dd/MM/yyyy HH:mm')}"></span></p>
        </div>

        <form th:action="@{/deployment}" method="post" class="form" onsubmit="return confirmDeployment()">
            <div class="form-group">
                <label for="requesterName">Votre nom *</label>
                <input type="text" id="requesterName" name="requesterName" required>
            </div>

            <div class="form-group">
                <label for="requesterEmail">Votre email *</label>
                <input type="email" id="requesterEmail" name="requesterEmail" required>
            </div>

            <div class="form-group">
                <label for="targetEnvironment">Environnement cible *</label>
                <select id="targetEnvironment" name="targetEnvironment" required>
                    <option value="">-- Sélectionner --</option>
                    <option value="GREEN">GREEN</option>
                    <option value="ORANGE">ORANGE</option>
                </select>
            </div>

            <div class="form-group">
                <label>Applications à déployer *</label>

                <!-- Search bar -->
                <div class="search-bar">
                    <input type="text"
                           id="appSearch"
                           placeholder="🔍 Rechercher une application..."
                           onkeyup="filterApplications()">
                    <span id="resultCount"></span>
                </div>

                <div class="checkbox-group" id="appCheckboxGroup">
                    <div th:each="app : ${applications}" class="checkbox-item-inline">
                        <input type="checkbox"
                               th:id="'app-' + ${app.name}"
                               name="applicationNames"
                               th:value="${app.name}"
                               th:disabled="${codeFreeze.isApplicationFrozen(app.name)}">
                        <label th:for="'app-' + ${app.name}">
                            <span class="app-name" th:text="${app.name}">App Name</span>
                            <span th:if="${codeFreeze.isApplicationFrozen(app.name)}" class="badge badge-danger">GELÉ</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Notes / Commentaires</label>
                <textarea id="notes" name="notes" rows="5"
                          placeholder="Ajoutez des informations supplémentaires sur cette demande..."></textarea>
            </div>

            <div class="form-actions">
                <a th:href="@{/}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary">Envoyer la demande</button>
            </div>
        </form>
    </main>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">⚠️</span>
                <h2>Confirmer la demande de déploiement</h2>
            </div>
            <div class="modal-body">
                <p class="modal-question">Êtes-vous sûr de vouloir envoyer cette demande ?</p>
                <div class="modal-details">
                    <div class="detail-row">
                        <strong>Environnement :</strong>
                        <span id="modalEnvironment" class="environment-badge"></span>
                    </div>
                    <div class="detail-row">
                        <strong>Nombre d'applications :</strong>
                        <span id="modalAppCount"></span>
                    </div>
                    <div class="detail-section">
                        <strong>Applications sélectionnées :</strong>
                        <ul id="modalAppList" class="app-list"></ul>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                <button type="button" id="confirmBtn" class="btn btn-primary" onclick="submitForm()">
                    <span class="btn-text">Confirmer l'envoi</span>
                    <span class="btn-spinner" style="display: none;">
                        <span class="spinner"></span>
                        Envoi en cours...
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        let formToSubmit = null;
        let isSubmitting = false;

        function confirmDeployment() {
            // Get selected applications
            const selectedApps = document.querySelectorAll('input[name="applicationNames"]:checked');

            // Check if at least one application is selected
            if (selectedApps.length === 0) {
                alert('Veuillez sélectionner au moins une application à déployer.');
                return false;
            }

            // Get target environment
            const environment = document.getElementById('targetEnvironment').value;

            // Populate modal with data
            const modalEnvironment = document.getElementById('modalEnvironment');
            modalEnvironment.textContent = environment;
            modalEnvironment.className = 'environment-badge environment-' + environment.toLowerCase();

            document.getElementById('modalAppCount').textContent = selectedApps.length;

            // Build application list
            const appList = document.getElementById('modalAppList');
            appList.innerHTML = '';
            selectedApps.forEach(app => {
                const label = document.querySelector(`label[for="${app.id}"] .app-name`);
                const li = document.createElement('li');
                li.textContent = label.textContent;
                appList.appendChild(li);
            });

            // Store form reference and show modal
            formToSubmit = document.querySelector('form');
            document.getElementById('confirmModal').style.display = 'flex';

            return false; // Prevent immediate form submission
        }

        function closeModal() {
            // Prevent closing if form is being submitted
            if (isSubmitting) {
                return;
            }
            document.getElementById('confirmModal').style.display = 'none';
            formToSubmit = null;
        }

        function submitForm() {
            if (formToSubmit && !isSubmitting) {
                isSubmitting = true;

                // Disable both buttons and show spinner
                const confirmBtn = document.getElementById('confirmBtn');
                const cancelBtn = document.getElementById('cancelBtn');

                confirmBtn.disabled = true;
                cancelBtn.disabled = true;

                confirmBtn.querySelector('.btn-text').style.display = 'none';
                confirmBtn.querySelector('.btn-spinner').style.display = 'inline-flex';

                // Remove the onsubmit handler to avoid infinite loop
                formToSubmit.onsubmit = null;
                formToSubmit.submit();
            }
        }

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !isSubmitting) {
                closeModal();
            }
        });

        function filterApplications() {
            const searchInput = document.getElementById('appSearch').value.toLowerCase();
            const checkboxItems = document.querySelectorAll('.checkbox-item-inline');
            let visibleCount = 0;

            checkboxItems.forEach(item => {
                const appName = item.querySelector('.app-name').textContent.toLowerCase();

                if (appName.includes(searchInput)) {
                    item.style.display = 'flex';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });

            // Update result count
            const resultCount = document.getElementById('resultCount');
            if (searchInput) {
                resultCount.textContent = `${visibleCount} résultat(s)`;
            } else {
                resultCount.textContent = '';
            }
        }

        // Select all visible checkboxes with Ctrl+A inside search box
        document.getElementById('appSearch').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'a') {
                e.preventDefault();
                const visibleCheckboxes = document.querySelectorAll('.checkbox-item-inline[style*="flex"] input[type="checkbox"]:not(:disabled)');
                visibleCheckboxes.forEach(cb => cb.checked = true);
            }
        });
    </script>
</body>
</html>
