# Default applications configuration
# This file is used as fallback when GitLab sync is not configured
# Each application corresponds to a GitLab project

applications:
  # Example application 1
  - name: "Frontend Application"
    description: "Main user interface"
    gitlabProjectId: 123
    gitlabProjectPath: "team/frontend-app"
    branch: "develop"
    enabled: true
    freezable: true  # Can be frozen during code freeze periods

  # Example application 2
  - name: "Backend API Service"
    description: "Main REST API"
    gitlabProjectId: 456
    gitlabProjectPath: "team/backend-api"
    branch: "develop"
    enabled: true
    freezable: true

  # Example application 3
  - name: "Authentication Service"
    description: "SSO authentication service"
    gitlabProjectId: 789
    gitlabProjectPath: "team/auth-service"
    branch: "develop"
    enabled: true
    freezable: false  # Cannot be frozen (critical)

  # Example application 4
  - name: "Worker Jobs"
    description: "Asynchronous task processing"
    gitlabProjectId: 101
    gitlabProjectPath: "team/worker-jobs"
    branch: "develop"
    enabled: true
    freezable: true

# Notes:
# - gitlabProjectId: Numeric ID of the project in GitLab
# - gitlabProjectPath: Project path (namespace/project-name)
# - branch: Branch to monitor (usually "develop")
# - enabled: If false, the application won't appear in the interface
# - freezable: If true, admin can block deployment during code freeze
#
# This file is ALWAYS read by the application at startup.
# It contains default example values for initial setup.
#
# This file can be:
# - Auto-generated by sync-gitlab-apps.sh if GITLAB_GROUPS is configured
# - Manually edited to customize applications
# - Restored from applications.yaml.default if deleted
